# Keybinds: migrados de hyprland.lua (inclui seus binds pessoais).
# Sintaxe Mango: bind=MOD,TECLA,DISPATCHER,PARAMETROS
# SUPER e a tecla Windows.
key_mode=default

# Aplicativos
bind=SUPER,Q,spawn,kitty
bind=SUPER,E,spawn_shell,kitty -e yazi "$HOME"
bind=SUPER,Tab,spawn,dolphin
bind=SUPER,D,spawn,kitty -e spotatui
bind=SUPER,F,spawn,firefox
bind=SUPER,R,spawn,rofi -show drun
bind=SUPER,Space,spawn,rofi -show drun
bind=CTRL+ALT,Delete,spawn,kitty -e btop

# Janela e sessao
bind=SUPER,W,killclient
bind=SUPER,C,killclient
bind=SUPER,V,togglefloating
bind=SUPER,M,quit
bind=SUPER+SHIFT,F,togglefullscreen
bind=SUPER+SHIFT,J,dwindle_toggle_split_direction

# Foco com setas e Vim
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down

# Tags 1-9 (no Hyprland eram workspaces 1-9)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
# Em Mango, Super+0 mostra todas as tags, NAO e um 10o workspace.
bind=SUPER,0,view,00

# Workspace especial do Hyprland -> special tag no Mango
bind=SUPER,S,toggle_special_tag
bind=SUPER+SHIFT,S,tag_special_tag

# Controle com mouse
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER,btn_middle,killclient
mousebind=CTRL+SHIFT,btn_middle,spawn_shell,sh "$HOME/.config/mango/scripts/toggle-mic.sh"
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client

# Controles de audio e brilho (precisam dos utilitarios do seu sistema)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
# bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause

# Screenshot de area -> Swappy
bind=NONE,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -

# Seu script MangoHud, acionado ao SOLTAR F8 (como no Hyprland).
bindr=NONE,F8,spawn_shell,"$HOME/.local/bin/mangohud-cs2-toggle"

# Atalho util para aplicar edicoes sem sair da sessao
bind=SUPER+SHIFT,R,reload_config

# Gesto 3 dedos, adaptado a navegacao entre tags
# (se estiver usando um touchpad)
gesturebind=NONE,left,3,viewtoright_have_client
gesturebind=NONE,right,3,viewtoleft_have_client

# Diferencas: Super+P (pseudo) nao tem equivalencia 1:1 confirmada.
# Shift+Super+0 do Hyprland (workspace 10) nao tem mapeamento direto aqui.
