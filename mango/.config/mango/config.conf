# MangoWM - migracao do Hyprland (arquivo hyprland.lua fornecido)
# Referencia: https://mangowm.github.io/docs/
# Configuracao pensada para ~/.config/mango/config.conf

# --------------------------------------
# AMBIENTE / DISPOSITIVOS
# --------------------------------------
env=QT_QPA_PLATFORMTHEME,qt6ct
env=XCURSOR_SIZE,24
cursor_size=24
xkb_rules_layout=br
mouse_accel_profile=1
mouse_accel_speed=0.0
trackpad_natural_scrolling=0
sloppy_focus=1

# --------------------------------------
# MONITORES
# 2o monitor vertical fica a esquerda do principal.
# Conferir nomes e refresh com: wlr-randr
# --------------------------------------
monitor_rule=name:^HDMI-A-1$,width:1920,height:1080,refresh:100,x:0,y:0,scale:1,rr:3
monitor_rule=name:^DP-1$,width:1920,height:1080,refresh:240,x:1080,y:620,scale:1,rr:0,primary:1
allow_tearing=0

# --------------------------------------
# APARENCIA (semelhante ao Hyprland)
# --------------------------------------
gap_inner_horizontal=4
gap_inner_vertical=4
gap_outer_horizontal=8
gap_outer_vertical=8
border_px=1
focus_color=0xff3333ee
border_color=0x320000AB
urgent_color=0x991b1bee
split_color=0xff3333ee
border_radius=12
focused_opacity=1.0
unfocused_opacity=1.0

# Blur similar, mas parametros nao sao identicos aos do Hyprland.
blur=1
blur_optimized=1
blur_params_radius=10
blur_params_num_passes=2

shadows=1
shadow_only_floating=1
shadows_size=4
shadows_blur=3
shadows_color=0x1a1a1aee

animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=fade
animation_fade_out=1
animation_duration_open=325
animation_duration_close=160
animation_duration_move=280
animation_duration_tag=160

# --------------------------------------
# LAYOUT / TAGS
# --------------------------------------
tag_num=9
# Tag rules prevalecem sobre os defaults do monitor.
tag_rule=id:*,layout_name:dwindle
dwindle_preserve_split=1
# Desabilita redimensionamento pela borda como no seu Hyprland.
enable_border_resize=0

# Escolhe a direção de divisão
dwindle_smart_split=1
dwindle_horizontal_split=0
dwindle_vertical_split=0

# --------------------------------------
# AUTOSTART (executar uma unica vez por sessao)
# --------------------------------------
exec_once=waybar
# Substitui hyprpaper por swaybg, preservando imagem por monitor.
exec_once=swaybg -o DP-1 -i ~/usr/Imagens/wallpapers/tela11.png -m fill -o HDMI-A-1 -i ~/usr/Imagens/wallpapers/tela2.jpg -m fill
exec_once=kitty
exec_once=kitty -e spotatui
exec_once=steam

# --------------------------------------
# ATALHOS EM ARQUIVO SEPARADO
# --------------------------------------
source=./keybinds.conf
