#:schema = "https://yazi-rs.github.io/schemas/theme.json"
[app]
overall = { bg = "reset" }

[mgr]
cwd = { fg = "#c8c8c8", italic = true }

# Find
find_keyword = { fg = "#181818", bg = "#ff8800", bold = true }
find_position = { fg = "#ff8800", bg = "#303030", bold = true }

# Symlink
symlink_target = { italic = true }

# Marker
marker_copied = { fg = "#ff8800", bg = "#ff8800" }
marker_cut = { fg = "#ff0000", bg = "#ff0000" }
marker_marked = { fg = "#bf5f24", bg = "#bf5f24" }
marker_selected = { fg = "#ffaa33", bg = "#ffaa33" }

# Count
count_copied = { fg = "#181818", bg = "#ff8800" }
count_cut = { fg = "#181818", bg = "#ff0000" }
count_selected = { fg = "#181818", bg = "#ffaa33" }

# Border
border_symbol = "│"
border_style = { fg = "#888888" }

# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

# Tab
[tabs]
active = { fg = "#181818", bg = "#ffaa33" }
inactive = { fg = "#ffaa33", bg = "#303030" }

[mode]
normal_main = { fg = "#181818", bg = "#ffaa33", bold = true }
normal_alt = { fg = "#ffaa33", bg = "#303030" }

select_main = { fg = "#181818", bg = "#bf5f24", bold = true }
select_alt = { fg = "#bf5f24", bg = "#303030" }

unset_main = { fg = "#181818", bg = "#bf5f24", bold = true }
unset_alt = { fg = "#bf5f24", bg = "#303030" }

# Hover
[indicator]
parent = { bg = "#303030" }
current = { bg = "#303030" }
preview = { bg = "#303030" }

[status]
overall = { fg = "#ededed", bg = "reset" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type = { fg = "#ffaa33" }
perm_read = { fg = "#ffaa33" }
perm_write = { fg = "#ff0000" }
perm_exec = { fg = "#ff8800" }
perm_sep = { fg = "#646464" }

# Progress
progress_label = { fg = "#ededed", bold = true }
progress_normal = { fg = "#ff8800", bg = "#303030" }
progress_error = { fg = "#ff0000", bg = "#303030" }

# Which
[which]
cols = 3
mask = { bg = "reset" }
cand = { fg = "#ff8800" }
rest = { fg = "#ffaa33" }
desc = { fg = "#bf5f24" }
separator = " ➜ "
separator_style = { fg = "#646464" }

# Confirm
[confirm]
border = { fg = "#ff8800" }
title = { fg = "#888888" }
body = {}
list = {}
btn_yes = { bg = "#303030" }
btn_no = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]

# Spottter
[spot]
border = { fg = "#888888" }
title = { fg = "#888888" }

# Notification
[notify]
title_info = { fg = "#ff8800" }
title_warn = { fg = "#ffaa33" }
title_error = { fg = "#ff0000" }

# Icons
icon_info = ""
icon_warn = ""
icon_error = ""

# Picker
[pick]
border = { fg = "#888888" }
active = { fg = "#ededed", bg = "#303030" }
inactive = { fg = "#ededed" }

# Input
[input]
border = { fg = "#ff8800" }
title = { fg = "#ff8800" }
value = { fg = "#bf5f24" }
selected = { bg = "#303030" }

# Completion
[cmp]
border = { fg = "#ff8800" }
active = { fg = "#ededed", bg = "#303030" }
inactive = { fg = "#ededed" }

# Icons
icon_file = ""
icon_folder = ""
icon_command = ""

# Task manager
[tasks]
border = { fg = "#888888" }
title = { fg = "#888888" }
hovered = { fg = "#ededed", bg = "#303030" }

# Help menu
[help]
on = { fg = "#ff8800" }
run = { fg = "#bf5f24" }
desc = { fg = "#ff8800" }
hovered = { bg = "#303030" }
footer = { fg = "#ededed", bg = "#181818" }

# File-specific styles
[icon]
conds = [
  { if = "dir", text = "", fg = "#8b2020" },
  { if = "file", text = "", fg = "#8b2020" },
]

[filetype]
rules = [
  # Images
  { mime = "image/*", fg = "#ff8800" },

  # Media
  { mime = "{audio,video}/*", fg = "#ff8800" },

  # Archives
  { mime = "application/*zip", fg = "#ff8800" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ff8800" },

  # Documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#ff8800" },

  # Empty files
  # { mime = "inode/x-empty", fg = "#ff0000" },

  # Special files
  { url = "*", is = "orphan", bg = "#ff0000" },
  { url = "*", is = "exec", fg = "#ff8800" },

  # Fallback
  { url = "*/", fg = "#ff0000" },
  { url = "*", fg = "#ff8800" },
]

